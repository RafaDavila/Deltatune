name: Deltatune CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deltatune
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: deltatune_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deltatune -d deltatune_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://deltatune:ci-password@localhost:5432/deltatune_test
      TEST_DATABASE_URL: postgresql+psycopg://deltatune:ci-password@localhost:5432/deltatune_test
      JWT_SECRET_KEY: ci-only-jwt-secret-not-for-production-123456789
      BREVO_API_KEY: ci-only-fake-brevo-key
      EMAIL_FROM_ADDRESS: deltatune@example.com
      FRONTEND_RESET_PASSWORD_URL: http://localhost:5173/redefinir-senha

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate migrations
        run: alembic upgrade head

      - name: Run backend tests
        run: python -m pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build